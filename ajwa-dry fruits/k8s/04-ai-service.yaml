apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service-deployment
  namespace: ajwa-commerce
  labels:
    app: ajwa-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ajwa-ai-service
  template:
    metadata:
      labels:
        app: ajwa-ai-service
    spec:
      containers:
        - name: ai-service
          image: ajwa-ai-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: PORT
              value: "5001"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: ajwa-commerce
spec:
  type: ClusterIP
  selector:
    app: ajwa-ai-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
