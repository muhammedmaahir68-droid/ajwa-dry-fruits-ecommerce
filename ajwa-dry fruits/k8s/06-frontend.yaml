apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: ajwa-commerce
  labels:
    app: ajwa-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ajwa-frontend
  template:
    metadata:
      labels:
        app: ajwa-frontend
    spec:
      containers:
        - name: frontend
          image: ajwa-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: ajwa-commerce
spec:
  type: ClusterIP
  selector:
    app: ajwa-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
